# Sleepless Twin exporter. Applied by the platform owner:
#   kubectl apply -k exporter
# after creating the Secret described in exporter/README.md. Removing it:
#   kubectl delete -k exporter
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sleepless-twin
resources:
  - k8s/namespace.yaml
  - k8s/rbac.yaml
  - k8s/deployment.yaml
configMapGenerator:
  - name: twin-exporter-code
    files:
      - exporter.py
labels:
  - pairs:
      app.kubernetes.io/part-of: sleepless-twin
    includeSelectors: false
