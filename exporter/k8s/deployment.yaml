apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin-exporter
  labels:
    app: twin-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate # never two exporters at once
  selector:
    matchLabels:
      app: twin-exporter
  template:
    metadata:
      labels:
        app: twin-exporter
    spec:
      serviceAccountName: twin-exporter
      # The job store is a hostPath on the control plane, so run there.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # python:3.12-slim, multi-arch index digest looked up 2026-11-18. Standard library only.
          image: python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          command: ["python", "-u", "/app/exporter.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DB_PATH
              value: /data/jobs.db
            - name: INGEST_URL
              valueFrom:
                secretKeyRef:
                  name: twin-exporter
                  key: INGEST_URL
            - name: HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: twin-exporter
                  key: HMAC_KEY
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: job-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: twin-exporter-code
        # The platform's job store (same path the orchestrator and worker mount). Read-only.
        # The only reason the namespace does not enforce a Pod Security profile (see namespace.yaml).
        - name: job-data
          hostPath:
            path: /var/lib/personal-ai/data
            type: Directory
